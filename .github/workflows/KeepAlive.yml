name: Keep Alive — Supabase

on:
  schedule:
    # Roda todo dia 5 vezes
    # Supabase pausa projetos free após 7 dias sem atividade
    - cron: '0 8,10,12,14,16 * * *' 
  workflow_dispatch: # permite rodar manualmente se precisar

permissions:
  contents: write # necessário para o passo de commit automático poder dar push

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SUPABASE_URL:      "https://vwpexqtezgptqnommvfk.supabase.co"
          SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3cGV4cXRlemdwdHFub21tdmZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzM3MDMsImV4cCI6MjA5NTcwOTcwM30.vKen_FFf58AQd0TUBCVqyrFQfjNSgbzqT2Vcz4Lhj8E'
        run: |
          echo "Enviando ping para o Supabase..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/listar_ruas" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_filtro": ""}')

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Banco respondeu corretamente."
          else
            echo "⚠️ Resposta inesperada: $RESPONSE"
            exit 1
          fi

      - name: Registrar atividade no repositório
        run: |
          mkdir -p .github/keep-alive
          echo "Último ping: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keep-alive/last-ping.txt

      # Esse commit é o que impede o GitHub de desabilitar este workflow agendado.
      # Regra do GitHub: cron é desativado automaticamente após 60 dias
      # sem NENHUMA atividade (commit/push) no repositório — mesmo que o
      # workflow em si continue rodando normalmente até esse momento.
      - name: Commit de manutenção (mantém o cron ativo)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: keep-alive ping [skip ci]"
          file_pattern: .github/keep-alive/last-ping.txt
