name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pelo Dashboard do GitHub

# Permissões mínimas necessárias para o deploy
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que só um deploy rode por vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Injeta as credenciais do Supabase no index.html
      #    Os valores vêm dos Secrets do GitHub — nunca aparecem nos logs
      - name: Injetar variáveis de ambiente
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Valida que os secrets foram configurados
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secret SUPABASE_URL não configurado!"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY não configurado!"
            exit 1
          fi

          # Substitui os placeholders no HTML pelos valores reais
          # Os valores SÓ existem na memória do runner durante esta etapa
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g"           index.html
          sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" index.html

          echo "✅ Variáveis injetadas com sucesso"

      # 3. Configura o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 4. Empacota os arquivos para deploy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Envia apenas os arquivos necessários — não inclui .github/ nem README
          path: '.'

      # 5. Publica no GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
