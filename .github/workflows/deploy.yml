name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Injetar variáveis de ambiente
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Valida secrets
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secret SUPABASE_URL não configurado!"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_ANON_KEY não configurado!"
            exit 1
          fi

          echo "--- Placeholders encontrados antes da substituição ---"
          grep -o '__SUPABASE_URL__\|__SUPABASE_ANON_KEY__' index.html || echo "AVISO: nenhum placeholder encontrado no index.html!"

          # Usa Python para substituição — mais robusto que sed com caracteres especiais
          python3 - << PYEOF
import os, sys

url = os.environ['SUPABASE_URL'].strip()
key = os.environ['SUPABASE_ANON_KEY'].strip()

with open('index.html', 'r', encoding='utf-8') as f:
    content = f.read()

if '__SUPABASE_URL__' not in content:
    print('ERRO: placeholder __SUPABASE_URL__ não encontrado no index.html', file=sys.stderr)
    sys.exit(1)
if '__SUPABASE_ANON_KEY__' not in content:
    print('ERRO: placeholder __SUPABASE_ANON_KEY__ não encontrado no index.html', file=sys.stderr)
    sys.exit(1)

content = content.replace('__SUPABASE_URL__', url)
content = content.replace('__SUPABASE_ANON_KEY__', key)

with open('index.html', 'w', encoding='utf-8') as f:
    f.write(content)

print('Substituição concluída com sucesso.')
PYEOF

          echo "--- Verificando resultado (não mostra os valores) ---"
          if grep -q '__SUPABASE_URL__\|__SUPABASE_ANON_KEY__' index.html; then
            echo "::error::Placeholders ainda presentes após substituição!"
            exit 1
          else
            echo "✅ Placeholders substituídos corretamente."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
